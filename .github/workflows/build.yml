name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Test Firestore security rules
        run: |
          set -o pipefail
          npx -y firebase-tools@15.34.1 emulators:exec --only firestore --project demo-mongle "node --test --test-reporter=spec tests/rules.test.mjs" 2>&1 | tee rules.log
      - name: Report rule test failures
        if: failure()
        run: |
          grep -n -E "not ok|✖|AssertionError|Error:|expected" rules.log | head -60 > err.txt || true
          python3 - <<'PY'
          lines = open('err.txt').read().splitlines()
          for i in range(0, min(len(lines), 90), 10):
              print('::error title=rules::' + '%0A'.join(l.replace('%', '%25') for l in lines[i:i+10]))
          PY

  build:
    needs: rules
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_KAKAO_KEY: ${{ secrets.KAKAO_REST_KEY }}
      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mongle.jks"; echo "MONGLE_KEYSTORE=$RUNNER_TEMP/mongle.jks" >> "$GITHUB_ENV"; fi
      - name: Build APK
        env:
          MONGLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee ../build.log
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk ../out/mongle-todo-1.0.${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/*.apk ../out/mongle-todo.apk
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -n -E "error:|e: |FAILED|What went wrong|AAPT|Exception|cannot find symbol|Execution failed" build.log | head -40 > err.txt || true
          grep -n -A15 "What went wrong" build.log | head -60 >> err.txt || true
          python3 - <<'PY'
          lines = open('err.txt').read().splitlines()
          for i in range(0, min(len(lines), 90), 10):
              chunk = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in lines[i:i+10])
              print('::error title=gradle::' + chunk)
          PY
      - name: Put the app and the APK behind the private link
        env:
          KEY: ${{ secrets.DOWNLOAD_KEY }}
        run: |
          if [ ${#KEY} -lt 16 ] || ! [[ "$KEY" =~ ^[A-Za-z0-9_-]+$ ]]; then echo "::error title=link::DOWNLOAD_KEY secret must be 16+ letters/numbers"; exit 1; fi
          mkdir -p site
          cp -r dist "site/$KEY"
          cp out/mongle-todo.apk "site/$KEY/mongle-todo.apk"
          echo '{"version":"1.0.${{ github.run_number }}"}' > "site/$KEY/version.json"
          printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>.</title>' > site/index.html
          cp site/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Remove public copies of old APKs
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          for t in $(gh release list -R "$R" --limit 300 --json tagName -q '.[].tagName'); do gh release delete "$t" -R "$R" --yes --cleanup-tag || true; done
          for id in $(gh api "repos/$R/actions/artifacts?per_page=100" --paginate -q '.artifacts[] | select(.name != "github-pages") | .id'); do gh api -X DELETE "repos/$R/actions/artifacts/$id" || true; done
