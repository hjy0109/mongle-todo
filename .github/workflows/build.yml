name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mongle.jks"; echo "MONGLE_KEYSTORE=$RUNNER_TEMP/mongle.jks" >> "$GITHUB_ENV"; fi
      - name: Build APK
        env:
          MONGLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee ../build.log
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk ../out/mongle-todo-1.0.${{ github.run_number }}.apk
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -n -E "error:|e: |FAILED|What went wrong|AAPT|Exception|cannot find symbol|Execution failed" build.log | head -40 > err.txt || true
          grep -n -A15 "What went wrong" build.log | head -60 >> err.txt || true
          python3 - <<'PY'
          lines = open('err.txt').read().splitlines()
          for i in range(0, min(len(lines), 90), 10):
              chunk = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in lines[i:i+10])
              print('::error title=gradle::' + chunk)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mongle-todo-apk
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 몽글 투두 1.0.${{ github.run_number }}
          body: 안드로이드 폰에서 아래 apk 파일을 받아 설치하세요.
          files: out/*.apk
          make_latest: true
